[package]
name = "alto-rooms-desktop"
version = "0.1.0"
description = "Alto Rooms desktop app"
edition = "2021"

# Own Cargo workspace: excluded from the repo-root workspace so `cargo test --workspace`
# at the root never builds Tauri.
[workspace]

[lib]
name = "alto_rooms_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-shell = "2.4.0"
tokio = { version = "1.53.2", features = ["time", "sync"] }
ureq = { version = "3", default-features = false }
