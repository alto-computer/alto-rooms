[workspace]
resolver = "2"
members = ["crates/rooms-protocol", "crates/rooms-core", "crates/roomsd", "crates/rooms-mcp", "crates/rooms-collect", "crates/rooms-sort"]
# The desktop app is its own Cargo workspace (Tauri); keep it out of root builds and tests.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.6.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
ts-rs = "10"
schemars = "0.8"
tokio = { version = "1", features = ["full"] }

# roomsd / rooms-mcp sidecars. Do NOT set panic = "abort": roomsd catches handler panics
# and answers 500 instead of dying.
[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# SQLite is C code compiled with the crate's opt-level; unoptimized it makes the index's
# apply transaction (held under the core lock) ~3.5x slower in debug builds.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
