[workspace]
resolver = "2"
members = ["crates/rooms-protocol", "crates/rooms-core", "crates/roomsd", "crates/rooms-mcp"]
# The desktop app is its own Cargo workspace (Tauri); keep it out of root builds and tests.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.4.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
ts-rs = "10"
schemars = "0.8"
tokio = { version = "1", features = ["full"] }

# SQLite is C code compiled with the crate's opt-level; unoptimized it makes the index's
# apply transaction (held under the core lock) ~3.5x slower in debug builds.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
