[workspace]
resolver = "2"
members = ["crates/rooms-protocol", "crates/rooms-core", "crates/roomsd"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
ts-rs = "10"
schemars = "0.8"
tokio = { version = "1", features = ["full"] }
